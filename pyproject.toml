[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[project]
name = "pyprtg-api"
version = "0.0.21"
authors = [
    {name="Jonny Le", email="jonny.le@computacenter.com"},
]
description = "Client API to communicate with PRTG instance."
dependencies = [
    "certifi >= 2026.10.19",
    "requests >= 2.34.2",
    "tenacity >= 9.2.1"
]
readme = "README.md"
license = {text="MIT"}
classifiers = [
    "Programming Language :: Python :: 3"
]

[project.urls]
Repository = "https://github.com/CC-Digital-Innovation/pyprtg-api.git"
